name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Verify signing secrets and restore fixed keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Secret: $name"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/stockinsight-release.jks"
          test -s "$RUNNER_TEMP/stockinsight-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/stockinsight-release.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Build fixed-signature Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/stockinsight-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Verify fixed APK certificate and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-manual}"
          APK="dist/StockInsight-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/signature.txt

          EXPECTED_CERT_SHA256="5d1974abcb0db5c8d7250c02397137fc1a354f0c9e2c3f35bd796cd966c98864"
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "Could not read signing certificate SHA-256 from APK."
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FATAL: Release signing certificate changed."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "Fixed signing certificate verified: $ACTUAL_CERT_SHA256"
          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: StockInsight-signed-release
          path: |
            dist/*.apk
            dist/signature.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "StockInsight $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
