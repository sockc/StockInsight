services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockinsight
      POSTGRES_USER: stockinsight
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - stockinsight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockinsight -d stockinsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://stockinsight:change-this-password@postgres:5432/stockinsight
    ports:
      - "8787:8787"

volumes:
  stockinsight_pg:
